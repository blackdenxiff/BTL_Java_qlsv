<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Đầu Tiên Của Tôi</title>
    <style>
        /* Một chút CSS để trang nhìn "xịn" hơn */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Chào thế giới! 👋</h1>
    <p>Đây là đoạn code HTML đầu tiên của bạn.</p>
    <button id="btnClick">Nhấn thử xem!</button>
    <p id="message" style="margin-top: 20px; color: green;"></p>
</div>

<script>
    // JavaScript để xử lý sự kiện khi nhấn nút
    const btn = document.getElementById('btnClick');
    const msg = document.getElementById('message');

    btn.addEventListener('click', () => {
        msg.textContent = "Tuyệt vời! Bạn vừa kích hoạt một đoạn Java roi đấy.";
    });
</script>

</body>
</html>
